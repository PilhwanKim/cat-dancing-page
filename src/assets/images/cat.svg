  <line x1="70" y1="85" x2="50" y2="85" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="90" x2="50" y2="92" stroke="#333" stroke-width="1.5"/>

  <line x1="130" y1="80" x2="150" y2="78" stroke="#333" stroke-width="1.5"/>
  <line x1="130" y1="85" x2="150" y2="85" stroke="#333" stroke-width="1.5"/>
  <line x1="130" y1="90" x2="150" y2="92" stroke="#333" stroke-width="1.5"/>

  <!-- 고양이 앞발 -->
  <ellipse cx="80" cy="155" rx="8" ry="15" fill="#ff8c94" stroke="#333" stroke-width="2"/>
  <ellipse cx="120" cy="155" rx="8" ry="15" fill="#ff8c94" stroke="#333" stroke-width="2"/>

  <!-- 고양이 뒷발 -->
