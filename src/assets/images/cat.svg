  <ellipse cx="125" cy="170" rx="6" ry="12" fill="#ff8c94" stroke="#333" stroke-width="2"/>

  <!-- 고양이 꼬리 -->
  <path d="M145 130 Q160 120 155 100 Q150 80 165 70" fill="none" stroke="#ff8c94" stroke-width="12" stroke-linecap="round"/>
  <path d="M145 130 Q160 120 155 100 Q150 80 165 70" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

  <!-- 배 무늬 -->
  <ellipse cx="100" cy="125" rx="25" ry="20" fill="#ffb3ba" opacity="0.7"/>

  <!-- 발가락 -->
  <circle cx="77" cy="167" r="2" fill="#333"/>
  <circle cx="83" cy="167" r="2" fill="#333"/>
  <circle cx="117" cy="167" r="2" fill="#333"/>
  <circle cx="123" cy="167" r="2" fill="#333"/>

  <circle cx="72" cy="182" r="2" fill="#333"/>
