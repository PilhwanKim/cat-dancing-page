  <ellipse cx="110" cy="75" rx="8" ry="10" fill="#333"/>

  <!-- 눈 하이라이트 -->
  <ellipse cx="88" cy="72" rx="3" ry="4" fill="#fff"/>
  <ellipse cx="108" cy="72" rx="3" ry="4" fill="#fff"/>

  <!-- 고양이 코 -->
