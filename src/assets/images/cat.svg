<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 고양이 몸체 -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#ff8c94" stroke="#333" stroke-width="2"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="80" r="35" fill="#ff8c94" stroke="#333" stroke-width="2"/>

  <!-- 고양이 귀 -->
  <path d="M75 55 L85 40 L95 55 Z" fill="#ff8c94" stroke="#333" stroke-width="2"/>
  <path d="M105 55 L115 40 L125 55 Z" fill="#ff8c94" stroke="#333" stroke-width="2"/>

  <!-- 귀 안쪽 -->
  <path d="M78 52 L85 43 L92 52 Z" fill="#ffb3ba"/>
  <path d="M108 52 L115 43 L122 52 Z" fill="#ffb3ba"/>

